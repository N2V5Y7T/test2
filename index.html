<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self';" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>The Nines</title>

  <!-- High-priority preload for instant, zero-blur first screen -->
  <link rel="preload" as="image" href="./frames/food/frame0001.webp" type="image/webp" fetchpriority="high" />
  <link rel="preload" as="image" href="./assets/logo-new.png" fetchpriority="high" />
  <link rel="preload" as="fetch" href="./frames/manifest.json" crossorigin />
  <link rel="preload" as="fetch" href="./assets/menu/the-nines-menu.json" crossorigin />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Inter:wght@300;400;500;600&display=swap" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      background: #0a0a0a;
      -webkit-text-size-adjust: 100%;
    }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'Inter', system-ui, sans-serif;
      margin: 0;
      min-height: 100vh;
      min-height: 100lvh;
      overscroll-behavior-y: none;
      -webkit-font-smoothing: antialiased;
    }

    button {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Fixed canvas viewport ── */
    /* Mobile Chrome / Safari Address Bar Immunity:
       Overscan 80px below screen and lock to 100lvh (Large Viewport Height).
       When Chrome's URL bar collapses on a swipe, the canvas is ALREADY painted
       in the newly exposed space — ZERO black strip and ZERO gap! */
    #canvas-viewport {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      height: 100vh; /* fallback */
      height: 100lvh;
      min-height: 100%;
      bottom: -80px;
      height: calc(100lvh + 80px);
      z-index: 0;
      overflow: hidden;

      opacity: 0;
      transform: translate3d(0, 0, 0);
      transition: opacity 0.32s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Subtle dynamic darkening behind menu text */
    #video-scrim {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.36);
      opacity: 0;
      pointer-events: none;
      z-index: 5;
      will-change: opacity;
    }

    body.ready #canvas-viewport {
      opacity: 1;
      transform: translate3d(0, 0, 0);
    }

    #main-canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ── Scroll container (drives all animations) ── */
    #scroll-container {
      position: relative;
      z-index: 1;
      pointer-events: none;
    }

    /* ── Menu Overlay ── */
    #menu-layer {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100vh;
      height: 100lvh;
      z-index: 10;
      pointer-events: none;
      color: #fff;
      opacity: 0;
      transition: opacity 0.32s cubic-bezier(0.16, 1, 0.3, 1);
    }
    body.ready #menu-layer {
      opacity: 1;
    }

    .menu-section {
      position: absolute;
      top: max(84px, calc(env(safe-area-inset-top) + 64px));
      left: 50%;
      transform: translate3d(-50%, 0, 0);
      width: 100%;
      max-width: 414px;
      padding: 0 24px;
      pointer-events: auto;
      text-shadow: 0 1px 4px rgba(0,0,0,0.92), 0 3px 18px rgba(0,0,0,0.65);
      will-change: transform, opacity;
    }

    .menu-section.group-intro {
      top: 50%;
      padding: 0 24px;
      transform: translate3d(-50%, -50%, 0);
    }

    /* Emergence animation layers (driven directly via JS translate3d for zero-reflow mobile scrolling) */
    .sec-header {
      text-align: center;
      margin-bottom: 8px;
      position: relative;
      z-index: 10;
      pointer-events: none;
      will-change: transform, opacity;
    }

    .menu-content {
      position: relative;
      z-index: 1;
      max-height: calc(100dvh - max(84px, calc(env(safe-area-inset-top) + 64px)) - 96px);
      overflow: hidden;
      will-change: transform, opacity;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0px, black 26px, black calc(100% - 32px), transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0px, black 26px, black calc(100% - 32px), transparent 100%);
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
    }

    .menu-scroll-track {
      padding-top: 24px;
      padding-bottom: 44px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    /* Typography */
    .group-title {
      font-family: 'Playfair Display', serif;
      font-size: 48px;
      font-weight: 400;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #fff;
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 30px;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: #fff;
      margin-bottom: 4px;
    }

    .section-note {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 300;
      color: #ccc;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .subgroup {
      margin-top: 32px;
    }
    .subgroup:first-child {
      margin-top: 0;
    }
    .subgroup-title {
      font-family: 'Playfair Display', serif;
      font-size: 21px;
      font-weight: 400;
      color: #d68f67;
      margin-bottom: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(214, 143, 103, 0.25);
      padding-bottom: 4px;
    }
    .subgroup-note {
      font-family: 'Inter', sans-serif;
      font-size: 12.5px;
      font-weight: 300;
      color: #bbb;
      margin-bottom: 16px;
    }

    .items-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .menu-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .item-name-wrap {
      flex: 1;
      min-width: 0;
    }

    .item-name {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.4;
      letter-spacing: 0.01em;
      margin: 0;
      color: #fff;
    }

    .item-note {
      font-size: 11px;
      font-weight: 400;
      color: #d68f67;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .price-flat {
      font-size: 15px;
      font-weight: 500;
      color: #d68f67;
      white-space: nowrap;
    }

    .menu-item.has-options .item-top-row {
      margin-bottom: 2px;
    }

    /* Multi-option dishes row: price chips on left, circular button strictly on right */
    .item-bottom-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-top: 6px;
    }
    .item-bottom-row .item-price {
      flex: 1;
      min-width: 0;
    }

    /* Chips */
    .price-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .price-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 20px;
      padding: 3px 10px;
    }
    .chip-label {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 400;
      color: #bbb;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .chip-price {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: #d68f67;
    }

    .item-desc {
      font-size: 12.5px;
      font-weight: 300;
      color: #c2c2c2;
      line-height: 1.45;
      letter-spacing: 0.01em;
      margin-top: 3px;
    }

    .diet-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      margin-right: 7px;
      transform: translateY(-1px);
      flex-shrink: 0;
    }
    .diet-dot.veg    { background: #4caf50; box-shadow: 0 0 0 1px rgba(255,255,255,0.45); }
    .diet-dot.nonveg { background: #f44336; box-shadow: 0 0 0 1px rgba(255,255,255,0.45); }

    /* ── Phase 4 UI: Navigation, Drawers, Buttons ── */
    #top-nav {
      position: fixed;
      top: 0; left: 0; width: 100%;
      height: 80px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding-top: max(0px, env(safe-area-inset-top));
      padding-left: max(20px, env(safe-area-inset-left));
      padding-right: max(20px, env(safe-area-inset-right));
      z-index: 50;
      background: linear-gradient(to bottom, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 100%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.32s cubic-bezier(0.16, 1, 0.3, 1);
    }
    body.ready #top-nav {
      opacity: 1;
    }
    #top-nav > * { pointer-events: auto; }

    #nav-hamburger-btn {
      background: none; border: none; color: #fff; cursor: pointer; padding: 8px;
      justify-self: start;
    }

    .logo-container {
      display: flex; justify-content: center; align-items: center;
    }
    #top-logo {
      height: 48px;
      width: auto;
      filter: invert(1) brightness(1.55) sepia(0.45) hue-rotate(-18deg);
    }

    #nav-list-btn {
      background: none; border: none;
      color: #fff;
      cursor: pointer;
      padding: 8px;
      justify-self: end;
      position: relative;
      display: flex; align-items: center;
    }
    #list-count {
      position: absolute;
      top: 2px; right: 2px;
      background: #c17b55;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 600;
      min-width: 16px; height: 16px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      padding: 0 3px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    #list-count.has-items {
      opacity: 1;
    }

    /* ── Bottom Group Tab Strip + Pagination Dots (Spec §4) ── */
    #bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      z-index: 45;
      padding: 8px 12px max(10px, env(safe-area-inset-bottom));
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.45) 70%, rgba(0,0,0,0) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    body.ready #bottom-nav.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .bottom-tabs-scroll {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      max-width: 414px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 2px 4px;
    }
    .bottom-tabs-scroll::-webkit-scrollbar {
      display: none;
    }
    .bottom-tab-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #bbb;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 6px 12px;
      border-radius: 16px;
      white-space: nowrap;
      cursor: pointer;
      min-height: 32px;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .bottom-tab-btn.active {
      background: #c17b55;
      border-color: #c17b55;
      color: #fff;
      font-weight: 600;
    }
    .bottom-dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .bottom-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.28);
      transition: transform 0.2s, background 0.2s;
    }
    .bottom-dot.active {
      background: #c17b55;
      transform: scale(1.35);
    }
    .bottom-group-sep {
      width: 1px;
      height: 16px;
      background: rgba(214, 143, 103, 0.35);
      flex-shrink: 0;
      margin: 0 2px;
    }
    .bottom-dot-sep {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(214, 143, 103, 0.4);
      margin: 0 2px;
    }

    /* ── Add to List Button — Strictly Circular (Never Oval) ── */
    .price-action-wrapper {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .add-btn {
      background: none;
      border: 1px solid rgba(255,255,255,0.35);
      color: #fff;
      width: 28px;
      height: 28px;
      min-width: 28px;
      max-width: 28px;
      min-height: 28px;
      max-height: 28px;
      aspect-ratio: 1 / 1;
      flex-shrink: 0;
      flex-grow: 0;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 16px;
      font-weight: 300;
      position: relative;
      box-sizing: border-box;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }
    .add-btn::after {
      content: '';
      position: absolute;
      inset: -8px;
    }
    .add-btn:hover {
      background: rgba(255,255,255,0.12);
      border-color: #fff;
    }
    .add-btn.added {
      background: #c17b55;
      border-color: #c17b55;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      width: 28px;
      height: 28px;
      min-width: 28px;
      max-width: 28px;
      min-height: 28px;
      max-height: 28px;
      aspect-ratio: 1 / 1;
      flex-shrink: 0;
      border-radius: 50%;
    }

    /* ── Inline quantity control (replaces add-btn when qty > 0) ── */
    .add-btn.qty-active {
      width: auto;
      min-width: 72px;
      max-width: none;
      height: 28px;
      min-height: 28px;
      aspect-ratio: auto;
      flex-shrink: 0;
      border-radius: 14px;
      border-color: #c17b55;
      background: rgba(193,123,85,0.22);
      padding: 0 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      cursor: default;
    }
    .add-btn.qty-active::after {
      display: none;
    }
    .qty-minus,
    .qty-plus {
      display: flex; align-items: center; justify-content: center;
      width: 22px; height: 22px;
      border-radius: 50%;
      font-size: 16px; font-weight: 300;
      color: #fff;
      cursor: pointer;
      position: relative;
    }
    .qty-minus::before,
    .qty-plus::before {
      content: '';
      position: absolute;
      inset: -10px;
    }
    .qty-num {
      font-size: 14px; font-weight: 500;
      color: #fff;
      min-width: 14px;
      text-align: center;
    }

    /* ── My List drawer — qty controls ── */
    .list-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
      gap: 12px;
    }
    .list-item-info {
      display: flex; flex-direction: column; gap: 3px;
      flex: 1; min-width: 0;
    }
    .list-item-name { font-size: 15px; font-weight: 400; }
    .list-item-unit-price { font-size: 12px; color: #888; }
    .list-item-price { font-size: 14px; color: #c17b55; font-weight: 500; }

    .list-item-qty-control {
      display: flex; align-items: center; gap: 8px;
      flex-shrink: 0;
    }
    .list-qty-btn {
      background: none;
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 300;
      cursor: pointer;
      min-width: 44px; min-height: 44px;
      box-sizing: border-box;
    }
    .list-qty-btn:hover { border-color: #c17b55; color: #c17b55; }
    .list-qty-num {
      font-size: 15px; font-weight: 500;
      color: #fff;
      min-width: 20px; text-align: center;
    }
    .empty-list {
      color: #888; font-style: italic; text-align: center; margin-top: 40px;
    }

    #clear-list-btn {
      background: none;
      border: 1px solid rgba(255,255,255,0.2);
      color: #bbb;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 6px 12px;
      border-radius: 14px;
      cursor: pointer;
      display: none;
      align-items: center;
    }
    #clear-list-btn:hover {
      border-color: #f44336;
      color: #fff;
    }

    /* ── Coordinated Scroll Locking & Overscroll Containment ── */
    html.overlay-scroll-locked,
    body.overlay-scroll-locked {
      overflow: hidden !important;
      overscroll-behavior: none !important;
      overscroll-behavior-y: none !important;
    }

    /* Drawers */
    #drawer-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.68);
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      touch-action: none;
      overscroll-behavior: none;
      overscroll-behavior-y: none;
    }
    #drawer-overlay.open {
      opacity: 1; pointer-events: auto;
    }

    .drawer {
      position: fixed; top: 0; bottom: 0;
      width: 85%; max-width: 400px;
      background: #111;
      z-index: 70;
      display: flex; flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      overscroll-behavior: contain;
      overscroll-behavior-y: contain;
    }
    .left-drawer { left: 0; transform: translate3d(-100%, 0, 0); }
    .right-drawer { right: 0; transform: translate3d(100%, 0, 0); }
    .drawer.open { transform: translate3d(0, 0, 0); }

    .drawer-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      gap: 12px;
      flex-shrink: 0;
      touch-action: none;
    }
    .drawer-header-actions {
      display: flex; align-items: center; gap: 10px;
    }
    .drawer-title {
      font-family: 'Playfair Display', serif;
      font-size: 24px; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.1em;
      color: #c17b55;
    }
    .close-drawer-btn {
      background: none; border: none; color: #fff; font-size: 20px; cursor: pointer;
    }

    .drawer-content {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 20px 24px;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      overscroll-behavior-y: contain;
      touch-action: pan-y;
    }

    /* Nav Links */
    .nav-group-header {
      font-family: 'Playfair Display', serif;
      font-size: 22px; color: #c17b55; margin-top: 24px; padding-bottom: 8px;
      text-transform: uppercase; letter-spacing: 0.1em;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .nav-link {
      display: block; width: 100%; text-align: left;
      background: none; border: none; color: #fff;
      padding: 14px 0; cursor: pointer;
      font-family: 'Inter', sans-serif; font-size: 15px;
      text-transform: uppercase; letter-spacing: 0.05em;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      transition: color 0.2s ease;
    }
    .nav-link:hover {
      color: #c17b55;
    }
    .nav-link.group-link {
      font-family: 'Playfair Display', serif;
      font-size: 22px; color: #c17b55; margin-top: 12px;
      letter-spacing: 0.1em;
    }
    .nav-link.section-link {
      padding-left: 16px;
      font-size: 14px;
      color: #bbb;
    }

    .drawer-footer {
      padding: 20px 24px max(24px, env(safe-area-inset-bottom));
      border-top: 1px solid rgba(255,255,255,0.1);
      background: #0a0a0a;
      flex-shrink: 0;
      touch-action: none;
    }
    .total-row {
      display: flex; justify-content: space-between; align-items: center;
      font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 500;
      margin-bottom: 10px; color: #fff;
    }
    .footer-note {
      font-size: 12px; color: #888; text-align: center;
    }

    /* ── Desktop / wide viewport: center the 9:16 frame ── */
    @media (min-aspect-ratio: 9/16) {
      #canvas-viewport,
      #top-nav,
      #bottom-nav {
        left: 50% !important;
        transform: translate3d(-50%, 0, 0) !important;
        width: calc(100vh * 9 / 16) !important;
        width: calc(100dvh * 9 / 16) !important;
      }

      #menu-layer {
        left: 50%;
        transform: translate3d(-50%, 0, 0);
        width: calc(100vh * 9 / 16);
        width: calc(100dvh * 9 / 16);
      }

      body::before,
      body::after {
        content: '';
        position: fixed;
        top: 0; bottom: 0;
        width: calc((100vw - (100vh * 9 / 16)) / 2);
        width: calc((100vw - (100dvh * 9 / 16)) / 2);
        background: #0a0a0a;
        z-index: -1;
      }
      body::before { left: 0; }
      body::after  { right: 0; }
    }

    /* ── Landscape phone ── */
    @media (orientation: landscape) and (max-height: 500px) {
      #canvas-viewport,
      #top-nav,
      #bottom-nav,
      #menu-layer {
        left: 0 !important;
        transform: none !important;
        width: 100% !important;
      }
      body::before, body::after { display: none; }

      #top-nav {
        height: 52px;
      }

      .group-title  { font-size: 32px; }
      .section-title { font-size: 22px; }
      .item-name    { font-size: 14px; }
      .item-price   { font-size: 13px; }
    }

    /* ── Minimum touch-target size: 44×44px (WCAG 2.5.5) ── */
    #nav-hamburger-btn,
    #nav-list-btn,
    .close-drawer-btn,
    .nav-link {
      min-height: 44px;
      min-width: 44px;
    }

    /* ── prefers-reduced-motion ── */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto !important; }
      .drawer {
        transition: opacity 0.2s ease !important;
        transform: none !important;
      }
      .left-drawer  { opacity: 0; pointer-events: none; }
      .right-drawer { opacity: 0; pointer-events: none; }
      .drawer.open  { opacity: 1; pointer-events: auto; }
    }

    /* ── Option Picker Bottom Sheet with Interactive Steppers ── */
    #option-picker-bg {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 200;
      opacity: 0;
      transition: opacity 0.22s ease;
      touch-action: none;
      overscroll-behavior: none;
      overscroll-behavior-y: none;
    }
    #option-picker-bg.open { opacity: 1; }

    #option-picker {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      max-width: 414px;
      margin: 0 auto;
      background: #141414;
      border-radius: 20px 20px 0 0;
      padding: 12px 0 max(20px, env(safe-area-inset-bottom));
      z-index: 201;
      transform: translate3d(0, 100%, 0);
      transition: transform 0.26s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 -8px 32px rgba(0,0,0,0.7);
      overscroll-behavior: contain;
      overscroll-behavior-y: contain;
    }
    #option-picker.open { transform: translate3d(0, 0, 0); }

    .picker-handle {
      width: 40px; height: 4px;
      background: rgba(255,255,255,0.25);
      border-radius: 2px;
      margin: 0 auto 14px;
      cursor: pointer;
      flex-shrink: 0;
      touch-action: none;
    }

    .picker-header {
      padding: 0 24px 10px;
      text-align: center;
      flex-shrink: 0;
      touch-action: none;
    }
    .picker-title {
      font-family: 'Playfair Display', serif;
      font-size: 20px; font-weight: 400;
      color: #fff;
      margin-bottom: 4px;
    }
    .picker-desc {
      font-family: 'Inter', sans-serif;
      font-size: 13px; color: #999;
      line-height: 1.45;
    }

    .picker-options {
      display: flex; flex-direction: column;
      max-height: 52vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border-top: 1px solid rgba(255,255,255,0.08);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      overscroll-behavior: contain;
      overscroll-behavior-y: contain;
      touch-action: pan-y;
    }

    .picker-option-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      gap: 14px;
      transition: background 0.18s ease;
    }
    .picker-option-row:last-child {
      border-bottom: none;
    }
    .picker-option-row.in-list {
      background: rgba(193, 123, 85, 0.12);
    }

    .picker-option-info {
      display: flex; flex-direction: column; gap: 3px;
      flex: 1; min-width: 0;
    }
    .picker-option-label {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 500;
      color: #fff;
      letter-spacing: 0.01em;
    }
    .picker-option-subdesc {
      font-size: 12px;
      color: #999;
      font-weight: 300;
      line-height: 1.35;
    }
    .picker-option-price {
      color: #d68f67;
      font-weight: 500;
      font-size: 14px;
      margin-top: 1px;
    }

    .picker-option-action {
      flex-shrink: 0;
    }

    .picker-add-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.02em;
      padding: 6px 14px;
      border-radius: 18px;
      cursor: pointer;
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .picker-add-btn:active {
      background: rgba(193, 123, 85, 0.25);
      border-color: #c17b55;
    }

    .picker-stepper {
      display: inline-flex;
      align-items: center;
      background: rgba(193, 123, 85, 0.2);
      border: 1px solid #c17b55;
      border-radius: 18px;
      padding: 2px 6px;
      gap: 6px;
    }
    .picker-step-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 17px;
      font-weight: 400;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 50%;
      min-width: 32px;
      min-height: 32px;
      transition: background 0.12s;
    }
    .picker-step-btn:active {
      background: rgba(255,255,255,0.18);
    }
    .picker-qty-num {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      min-width: 18px;
      text-align: center;
    }

    .picker-footer {
      padding: 14px 24px 4px;
    }
    .picker-done-btn {
      width: 100%;
      background: #c17b55;
      border: none;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 13px 0;
      border-radius: 22px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      min-height: 44px;
    }
    .picker-done-btn:active {
      transform: scale(0.98);
      background: #ad6d4a;
    }
  </style>
</head>
<body>

  <!-- Sticky canvas (video frame display) -->
  <div id="canvas-viewport">
    <canvas id="main-canvas"></canvas>
    <div id="video-scrim"></div>
  </div>

  <!-- Top Navigation Bar -->
  <header id="top-nav">
    <button id="nav-hamburger-btn" aria-label="Menu">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>

    <div class="logo-container">
      <img src="./assets/logo-new.png" alt="The Nines" id="top-logo" fetchpriority="high" />
    </div>

    <button id="nav-list-btn" aria-label="My List">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"/>
        <circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
      <span id="list-count">0</span>
    </button>
  </header>

  <!-- Bottom Section Tab Strip + Group Pagination Dots (Spec §4) -->
  <nav id="bottom-nav" aria-label="Section navigation"></nav>

  <!-- Navigation Drawer (Hamburger) -->
  <div id="nav-drawer" class="drawer left-drawer">
    <div class="drawer-header">
      <h3 class="drawer-title">Menu</h3>
      <button id="close-nav-btn" class="close-drawer-btn" aria-label="Close menu">✕</button>
    </div>
    <div id="nav-links" class="drawer-content"></div>
  </div>

  <!-- My List Drawer -->
  <div id="list-drawer" class="drawer right-drawer">
    <div class="drawer-header">
      <h3 class="drawer-title">My List</h3>
      <div class="drawer-header-actions">
        <button id="clear-list-btn" aria-label="Clear list">Clear</button>
        <button id="close-list-btn" class="close-drawer-btn" aria-label="Close list">✕</button>
      </div>
    </div>
    <div id="list-items-container" class="drawer-content">
      <p class="empty-list">Your list is empty.</p>
    </div>
    <div class="drawer-footer">
      <div class="total-row">
        <span>Estimated Total</span>
        <span id="list-total-sum">₹0</span>
      </div>
      <p class="footer-note">Show this to your server to place an order.</p>
    </div>
  </div>

  <!-- Drawer Overlay (shared) -->
  <div id="drawer-overlay"></div>

  <!-- Menu Overlay -->
  <div id="menu-layer"></div>

  <!-- Scroll container (makes the page tall enough for all sections) -->
  <div id="scroll-container"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
